<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Book Studio — конвертер в EPUB</title>
<meta name="theme-color" content="#0a0a0b" id="meta-theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<!-- Local libs only — Book Studio works fully offline, matching the reader. -->
<script src="libs/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'libs/pdf.worker.min.js';</script>
<script src="libs/jszip.min.js"></script>

<link rel="stylesheet" href="styles.css">
<style>
  /* Book Studio reuses every design token from styles.css (same dark/light/
     sepia palette, same serif+sans pairing, same radii/shadows) so it never
     feels like a different product bolted onto the reader. This block only
     adds the handful of layout patterns unique to a file-management screen
     that the reader's stylesheet has no reason to define. */
  body { overflow: auto; }
  .studio-header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(12px + var(--safe-top)) max(20px, var(--safe-right)) 12px max(20px, var(--safe-left));
    background: color-mix(in srgb, var(--bg-elevated) 88%, transparent);
    backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
    border-bottom: 1px solid var(--border);
  }
  .studio-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .studio-mark {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 15px; font-weight: 700;
    background: linear-gradient(150deg, var(--accent-bright), var(--accent));
    color: var(--accent-ink, #1a1611);
  }
  .studio-title { font-family: var(--font-serif); font-size: 1.05rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .studio-subtitle { font-size: 0.68rem; color: var(--text-muted); margin-top: 1px; }
  .studio-back {
    display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
    font-size: 0.78rem; font-weight: 600; color: var(--text-secondary);
    text-decoration: none; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); transition: color .15s, border-color .15s;
  }
  .studio-back:hover { color: var(--text); border-color: var(--border-strong); }

  .studio-main { max-width: var(--page-max); margin: 0 auto; padding: 22px clamp(18px, 3vw, 44px) calc(40px + var(--safe-bottom)); }

  .studio-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
  .studio-toolbar .btn-row-inline { display: flex; gap: 8px; flex-wrap: wrap; }
  .studio-toolbar select { max-width: 170px; }

  .studio-drop {
    border: 1.5px dashed var(--border-strong);
    border-radius: var(--radius-lg);
    padding: 54px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .studio-drop.dragover { border-color: var(--accent); background: var(--accent-soft); }
  .studio-drop-icon {
    width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px;
    display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border-strong); color: var(--accent);
  }
  .studio-drop h3 { font-family: var(--font-serif); font-weight: 500; font-size: 1.2rem; margin-bottom: 6px; }
  .studio-drop p { color: var(--text-muted); font-size: 0.85rem; }

  .file-list { display: flex; flex-direction: column; gap: 8px; }
  .file-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--border-strong);
    background: var(--surface);
  }
  .file-badge {
    width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 0.62rem; font-weight: 700; letter-spacing: .02em;
    color: rgba(255,255,255,.92);
  }
  .file-badge.fmt-pdf  { background: linear-gradient(150deg, #7a2b3c, #34101a 78%); }
  .file-badge.fmt-fb2  { background: linear-gradient(150deg, #7a5a26, #2c1f0e 78%); }
  .file-badge.fmt-djvu { background: linear-gradient(150deg, #1f6b4c, #0a2419 78%); }
  .file-info { min-width: 0; flex: 1; }
  .file-name { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }
  .file-status { flex-shrink: 0; }
  .status-pill { font-size: 0.68rem; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .status-pending   { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
  .status-converting{ background: var(--accent-soft); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
  .status-error      { background: rgba(248,113,113,.12); color: var(--danger); border: 1px solid rgba(248,113,113,.3); }
  .status-done-btn {
    border: none; border-radius: 10px; padding: 8px 14px; font-size: 0.76rem; font-weight: 700; cursor: pointer;
    background: linear-gradient(135deg, var(--accent-bright), var(--accent)); color: var(--accent-ink, #1a1611);
  }
  .file-remove {
    width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text-muted); cursor: pointer; flex-shrink: 0; font-size: 0.8rem;
  }

  .studio-action-bar {
    position: sticky; bottom: 0; margin-top: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px calc(14px + var(--safe-bottom));
    background: color-mix(in srgb, var(--bg-elevated) 92%, transparent);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border-strong); border-radius: var(--radius-lg);
  }
  .studio-action-bar .stat-text { font-size: 0.82rem; color: var(--text-secondary); }
  .studio-action-bar button { width: auto; padding: 12px 22px; margin-top: 0; }

  .toast-stack { position: fixed; bottom: calc(20px + var(--safe-bottom)); left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .studio-toast {
    background: var(--surface); color: var(--text); border: 1px solid var(--border-strong);
    padding: 11px 20px; border-radius: 999px; box-shadow: var(--shadow); font-size: 0.85rem; font-weight: 500;
    animation: toastIn .22s var(--ease);
  }
  @media (max-width: 560px) {
    .studio-header { padding-left: 16px; padding-right: 16px; }
    .studio-subtitle { display: none; }
    .studio-main { padding: 16px 12px calc(30px + var(--safe-bottom)); }
    .studio-drop { padding: 40px 16px; }
  }
</style>
</head>
<body>
  <header class="studio-header">
    <div class="studio-brand">
      <div class="studio-mark">✦</div>
      <div style="min-width:0">
        <div class="studio-title">Book Studio</div>
        <div class="studio-subtitle">Конвертер в EPUB · офлайн</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
      <button class="icon-btn" id="theme-toggle" title="Тема"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 3.5A8.5 8.5 0 0 0 12 20.5Z" fill="currentColor"/></svg></button>
      <a href="index.html" class="studio-back">← Читалка</a>
    </div>
  </header>

  <main class="studio-main">
    <div class="studio-toolbar">
      <div class="btn-row-inline">
        <button class="primary-btn" id="addFileBtn" style="width:auto;margin-top:0">+ Добавить книги</button>
        <button class="secondary-btn" id="addFolderBtn">📁 Папка</button>
      </div>
      <select class="sort-select" id="formatSelect" aria-label="Формат">
        <option value="all">Все форматы</option>
        <option value="pdf">PDF</option>
        <option value="fb2">FB2</option>
        <option value="djvu">DJVU</option>
      </select>
    </div>

    <div class="studio-drop" id="dropZone">
      <div class="studio-drop-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
      <h3>Перетащите файлы сюда</h3>
      <p>PDF и FB2 конвертируются в EPUB прямо в браузере — файлы никуда не отправляются.</p>
    </div>
    <div class="file-list" id="fileList" style="display:none"></div>

    <div class="studio-action-bar" id="actionBar" style="display:none">
      <div class="stat-text" id="statText">Выбрано: 0</div>
      <button class="primary-btn" id="convertBtn">Конвертировать всё</button>
    </div>
  </main>

  <div class="toast-stack" id="toastContainer"></div>

  <input type="file" id="fileInput" accept=".pdf,.fb2,.djvu,.djv" multiple style="display:none">
  <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none">

<script>
document.addEventListener('DOMContentLoaded', () => {
  const state = { files: [], format: 'all', converting: false };

  const D = {
    fileInput: document.getElementById('fileInput'),
    folderInput: document.getElementById('folderInput'),
    dropZone: document.getElementById('dropZone'),
    fileList: document.getElementById('fileList'),
    actionBar: document.getElementById('actionBar'),
    statText: document.getElementById('statText'),
    convertBtn: document.getElementById('convertBtn'),
    formatSelect: document.getElementById('formatSelect'),
    toasts: document.getElementById('toastContainer'),
    themeToggle: document.getElementById('theme-toggle'),
  };

  // ---- theme (shared storage key with the reader, so switching feels continuous) ----
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('readerTheme', theme);
    document.getElementById('meta-theme-color').content =
      theme === 'light' ? '#f7f5f0' : theme === 'sepia' ? '#f1e7d3' : '#0a0a0b';
  }
  applyTheme(localStorage.getItem('readerTheme') || 'dark');
  D.themeToggle.addEventListener('click', () => {
    const order = ['dark', 'light', 'sepia'];
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    applyTheme(order[(order.indexOf(current) + 1) % 3]);
  });

  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'studio-toast';
    t.textContent = msg;
    D.toasts.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 3200);
  }

  function formatSize(b) { return b < 1024*1024 ? (b/1024).toFixed(0) + ' КБ' : (b/1024/1024).toFixed(2) + ' МБ'; }
  function getExt(name) { return name.split('.').pop().toLowerCase(); }

  // Every book title, filename, and every scrap of extracted text below ends
  // up embedded inside XML/XHTML (the EPUB's chapter files, content.opf,
  // toc.ncx). None of that text is under our control — a book's own prose
  // routinely contains &, <, > ("Tom & Jerry", "5 < 10", em dashes an OCR
  // pass mangled into stray angle brackets...). Previously nothing here was
  // escaped, so any such character silently corrupted the resulting EPUB's
  // XML and could make a whole chapter fail to open. This is the one
  // function every piece of user-sourced text must pass through before
  // being written into any of the XML templates below.
  function escapeXml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;'
    }[ch]));
  }

  function uuidLike() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }

  document.getElementById('addFileBtn').onclick = () => D.fileInput.click();
  document.getElementById('addFolderBtn').onclick = () => D.folderInput.click();
  D.dropZone.onclick = () => D.fileInput.click();
  D.formatSelect.onchange = e => { state.format = e.target.value; render(); };

  D.dropZone.ondragover = e => { e.preventDefault(); D.dropZone.classList.add('dragover'); };
  D.dropZone.ondragleave = () => D.dropZone.classList.remove('dragover');
  D.dropZone.ondrop = e => { e.preventDefault(); D.dropZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); };
  D.fileInput.onchange = e => { handleFiles(e.target.files); e.target.value = ''; };
  D.folderInput.onchange = e => { handleFiles(e.target.files); e.target.value = ''; };

  function handleFiles(list) {
    // EPUB is deliberately not accepted: it's already the output format, and
    // the old converter used to silently accept it, "convert" it through a
    // generic fallback, and discard the entire real book in favour of a
    // single fake placeholder paragraph. Better to not offer the option at
    // all than to destroy someone's book.
    const valid = ['pdf', 'fb2', 'djvu', 'djv'];
    let added = 0, skipped = 0;
    Array.from(list).forEach(f => {
      const ext = getExt(f.name);
      if (valid.includes(ext)) {
        state.files.push({ id: Math.random().toString(36).slice(2, 11), file: f, name: f.name, ext, size: f.size, status: 'pending' });
        added++;
      } else if (getExt(f.name) === 'epub') {
        skipped++;
      }
    });
    if (added) showToast(`Добавлено книг: ${added}`);
    if (skipped) showToast('EPUB уже готов — конвертировать его незачем');
    render();
  }

  window.downloadBook = (id) => {
    const item = state.files.find(f => f.id === id);
    if (!item || !item.blob) return;
    const outName = item.name.replace(/\.[^/.]+$/, '') + '.epub';
    const epubFile = new File([item.blob], outName, { type: 'application/epub+zip' });
    if (navigator.canShare && navigator.canShare({ files: [epubFile] })) {
      navigator.share({ files: [epubFile], title: outName }).catch(() => {
        const a = document.createElement('a'); a.href = URL.createObjectURL(epubFile); a.download = outName; a.click();
      });
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(epubFile); a.download = outName; a.click();
    }
  };

  window.removeBook = (id) => {
    state.files = state.files.filter(f => f.id !== id);
    render();
  };

  const fmtLabel = { pdf: 'PDF', fb2: 'FB2', djvu: 'DJVU', djv: 'DJVU' };

  function render() {
    let items = state.files;
    if (state.format !== 'all') items = items.filter(f => f.ext === state.format || (state.format === 'djvu' && f.ext === 'djv'));

    const hasFiles = state.files.length > 0;
    D.dropZone.style.display = hasFiles ? 'none' : 'block';
    D.fileList.style.display = hasFiles ? 'flex' : 'none';
    D.fileList.style.flexDirection = 'column';
    D.actionBar.style.display = hasFiles ? 'flex' : 'none';
    const doneCount = state.files.filter(f => f.status === 'done').length;
    D.statText.textContent = `Книг: ${state.files.length}${doneCount ? ` · готово: ${doneCount}` : ''}`;

    D.fileList.innerHTML = '';
    items.forEach(f => {
      const el = document.createElement('div');
      el.className = 'file-item';
      let action = '';
      if (f.status === 'pending') action = `<span class="status-pill status-pending">В очереди</span>`;
      else if (f.status === 'converting') action = `<span class="status-pill status-converting">Конвертация…</span>`;
      else if (f.status === 'done') action = `<button class="status-done-btn" onclick="downloadBook('${f.id}')">Скачать EPUB</button>`;
      else action = `<span class="status-pill status-error" title="${escapeXml(f.error || '')}">Ошибка</span>`;

      el.innerHTML = `
        <div class="file-badge fmt-${f.ext === 'djv' ? 'djvu' : f.ext}">${fmtLabel[f.ext] || f.ext.toUpperCase()}</div>
        <div class="file-info">
          <div class="file-name">${escapeXml(f.name)}</div>
          <div class="file-meta">${formatSize(f.size)}${f.status === 'error' && f.error ? ' · ' + escapeXml(f.error) : ''}</div>
        </div>
        <div class="file-status">${action}</div>
        ${f.status !== 'converting' ? `<button class="file-remove" onclick="removeBook('${f.id}')" title="Убрать">✕</button>` : ''}
      `;
      D.fileList.appendChild(el);
    });
  }

  // ---------------------------------------------------------------------
  // Conversion engine
  // ---------------------------------------------------------------------

  // PDF.js text items only carry fragments + their absolute position — there
  // is no "paragraph" concept at all. Joining every fragment on a page with
  // a single space (the old behaviour) produces one giant wall of text per
  // page with no paragraph breaks, nothing like the source. This groups
  // fragments into lines by Y-position, then lines into paragraphs by
  // looking for a vertical gap noticeably bigger than the normal line
  // spacing — the same heuristic PDF-to-text tools generally use in the
  // absence of real structural markup.
  function pdfPageToParagraphs(items) {
    if (!items.length) return [];
    const lines = [];
    let curLine = [];
    let lineY = items[0].transform[5];
    const Y_TOL = 2.2;
    for (const it of items) {
      const y = it.transform[5];
      if (Math.abs(y - lineY) > Y_TOL) {
        if (curLine.length) lines.push({ y: lineY, items: curLine });
        curLine = [];
        lineY = y;
      }
      curLine.push(it);
    }
    if (curLine.length) lines.push({ y: lineY, items: curLine });

    const paragraphs = [];
    let cur = [];
    let prevY = null;
    for (const line of lines) {
      const text = line.items.map(it => it.str).join('').replace(/\s+/g, ' ').trim();
      if (!text) continue;
      const heights = line.items.map(it => Math.abs(it.transform[3]) || 10);
      const lineHeight = Math.max(...heights, 8);
      if (prevY !== null) {
        const gap = prevY - line.y; // PDF space: Y decreases going down the page
        if (gap > lineHeight * 1.55) {
          if (cur.length) paragraphs.push(cur.join(' '));
          cur = [];
        }
      }
      cur.push(text);
      prevY = line.y;
    }
    if (cur.length) paragraphs.push(cur.join(' '));
    return paragraphs;
  }

  async function convertPdf(arrayBuffer, title) {
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const chapters = [];
    // No page cap — every page is converted. Large books just produce more
    // (small) chapter files, which is also better for e-reader performance
    // than one gigantic XHTML file, and gives a real page-by-page TOC.
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      const paragraphs = pdfPageToParagraphs(tc.items);
      const html = paragraphs.length
        ? paragraphs.map(p => `<p>${escapeXml(p)}</p>`).join('\n')
        : `<p class="empty-page-note"><em>(страница без текстового слоя)</em></p>`;
      chapters.push({ title: `Страница ${i}`, html });
    }
    return chapters;
  }

  // FB2 uses <section>/<title> for real chapter structure when present —
  // splitting on that gives a proper multi-entry table of contents instead
  // of one flat dump. Falls back to a flat paragraph list for FB2 files
  // that don't use sections.
  async function convertFb2(arrayBuffer) {
    const text = new TextDecoder('utf-8').decode(arrayBuffer);
    const xml = new DOMParser().parseFromString(text, 'application/xml');
    if (xml.querySelector('parsererror')) throw new Error('Файл повреждён или не является корректным FB2');

    const body = xml.querySelector('body') || xml.documentElement;
    const sections = body ? Array.from(body.querySelectorAll(':scope > section')) : [];

    const sectionToHtml = (section) => {
      const titleEl = section.querySelector(':scope > title');
      const heading = titleEl ? titleEl.textContent.trim().replace(/\s+/g, ' ') : '';
      // Exclude <p> elements that live inside <title> (FB2 titles are
      // themselves made of <p> tags) — otherwise the chapter heading's own
      // text gets duplicated as the section's first body paragraph too.
      const paras = Array.from(section.querySelectorAll('p'))
        .filter(p => !p.closest('title'))
        .map(p => p.textContent.trim())
        .filter(Boolean)
        .map(t => `<p>${escapeXml(t)}</p>`)
        .join('\n');
      return { heading, html: paras };
    };

    if (sections.length) {
      return sections.map((s, i) => {
        const { heading, html } = sectionToHtml(s);
        return { title: heading || `Глава ${i + 1}`, html: (heading ? `<h2>${escapeXml(heading)}</h2>\n` : '') + html };
      }).filter(c => c.html);
    }

    const paras = Array.from(xml.querySelectorAll('p')).map(p => p.textContent.trim()).filter(Boolean);
    if (!paras.length) throw new Error('В файле не найдено текста');
    return [{ title: 'Текст', html: paras.map(t => `<p>${escapeXml(t)}</p>`).join('\n') }];
  }

  async function buildEpub(fileObj, chapters) {
    const zip = new JSZip();
    zip.file('mimetype', 'application/epub+zip', { compression: 'STORE' });
    zip.folder('META-INF').file('container.xml',
`<?xml version="1.0"?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
  <rootfiles>
    <rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/>
  </rootfiles>
</container>`);

    const oebps = zip.folder('OEBPS');
    const safeTitle = escapeXml(fileObj.name.replace(/\.[^/.]+$/, ''));
    const uid = uuidLike();

    oebps.file('style.css',
`body { font-family: Georgia, 'Times New Roman', serif; line-height: 1.6; margin: 1em; }
h1, h2 { font-weight: 600; }
p { margin: 0 0 1em; text-indent: 1.2em; }
.empty-page-note { text-indent: 0; opacity: .6; font-style: italic; }`);

    chapters.forEach((ch, i) => {
      oebps.file(`chapter${i + 1}.xhtml`,
`<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head><title>${escapeXml(ch.title)}</title><link rel="stylesheet" type="text/css" href="style.css"/></head>
<body>
${i === 0 ? `<h1>${safeTitle}</h1>\n` : ''}${ch.html}
</body>
</html>`);
    });

    const manifestItems = chapters.map((c, i) => `<item id="chap${i + 1}" href="chapter${i + 1}.xhtml" media-type="application/xhtml+xml"/>`).join('\n    ');
    const spineItems = chapters.map((c, i) => `<itemref idref="chap${i + 1}"/>`).join('\n    ');
    oebps.file('content.opf',
`<?xml version="1.0" encoding="utf-8"?>
<package xmlns="http://www.idpf.org/2007/opf" unique-id="BookId" version="2.0">
  <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
    <dc:title>${safeTitle}</dc:title>
    <dc:language>ru</dc:language>
    <dc:identifier id="BookId">urn:uuid:${uid}</dc:identifier>
  </metadata>
  <manifest>
    <item id="css" href="style.css" media-type="text/css"/>
    ${manifestItems}
    <item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>
  </manifest>
  <spine toc="ncx">
    ${spineItems}
  </spine>
</package>`);

    const navPoints = chapters.map((c, i) =>
`    <navPoint id="np-${i + 1}" playOrder="${i + 1}">
      <navLabel><text>${escapeXml(c.title)}</text></navLabel>
      <content src="chapter${i + 1}.xhtml"/>
    </navPoint>`).join('\n');
    oebps.file('toc.ncx',
`<?xml version="1.0" encoding="utf-8"?>
<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">
  <head><meta name="dtb:uid" content="urn:uuid:${uid}"/></head>
  <docTitle><text>${safeTitle}</text></docTitle>
  <navMap>
${navPoints}
  </navMap>
</ncx>`);

    return zip.generateAsync({ type: 'blob', mimeType: 'application/epub+zip' });
  }

  async function realConvert(fileObj) {
    const arrayBuffer = await fileObj.file.arrayBuffer();
    let chapters;
    if (fileObj.ext === 'pdf') {
      chapters = await convertPdf(arrayBuffer, fileObj.name);
    } else if (fileObj.ext === 'fb2') {
      chapters = await convertFb2(arrayBuffer);
    } else if (fileObj.ext === 'djvu' || fileObj.ext === 'djv') {
      // DJVU files are almost always scanned page images. Reliable text
      // extraction would require running OCR client-side, which this tool
      // doesn't do. Previously this silently "succeeded" with a single fake
      // paragraph claiming to be the book's content — actively misleading.
      // Failing loudly and explaining why is the honest option until real
      // OCR support exists.
      throw new Error('DJVU обычно — скан без текстового слоя; конвертация текста не поддерживается');
    } else {
      throw new Error('Формат не поддерживается');
    }
    if (!chapters || !chapters.length) throw new Error('Не удалось извлечь текст из файла');
    return buildEpub(fileObj, chapters);
  }

  D.convertBtn.onclick = async () => {
    const pending = state.files.filter(f => f.status === 'pending' || f.status === 'error');
    if (!pending.length) return;
    D.convertBtn.disabled = true;
    let okCount = 0, errCount = 0;

    for (const f of pending) {
      f.status = 'converting';
      render();
      try {
        f.blob = await realConvert(f);
        f.status = 'done';
        okCount++;
      } catch (e) {
        console.error(e);
        f.status = 'error';
        f.error = e && e.message ? e.message : 'Не удалось конвертировать';
        errCount++;
      }
      render();
    }
    D.convertBtn.disabled = false;
    if (errCount === 0) showToast(`Готово: ${okCount} книг${okCount === 1 ? 'а' : ''} сконвертировано`);
    else showToast(`Готово: ${okCount} успешно, ${errCount} с ошибкой`);
  };

  render();
});
</script>
</body>
</html>
